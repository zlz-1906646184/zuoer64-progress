<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>zuoer64 双壳计划 · 进度</title>
<style>
  :root{
    --bg:#0b0f14; --card:#151c24; --card-hi:#1a232d; --line:#232e3a;
    --track:#28333f; --accent:#39e1c4; --accent2:#7cc8ff;
    --white:#f2f6fa; --grey:#8b98a6; --grey2:#5b6875;
    --warn:#ffb020; --ok:#2fe3a5; --block:#ff6b6b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    line-height:1.5; overflow-x:hidden;
    padding:0 16px calc(60px + env(safe-area-inset-bottom));
  }
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85}
  .wrap{position:relative;z-index:1;max-width:720px;margin:0 auto}

  /* ---------- 顶部 ---------- */
  header{padding:44px 0 8px}
  .eyebrow{
    display:flex;align-items:center;gap:10px;
    font-size:12px;letter-spacing:.16em;color:var(--accent);
    text-transform:uppercase;margin-bottom:18px;
  }
  .eyebrow::before{content:"";width:34px;height:2px;background:var(--accent);border-radius:2px}
  h1{font-size:clamp(28px,7vw,40px);line-height:1.15;letter-spacing:-.02em;font-weight:800}
  h1 .accent{color:var(--accent);display:block;margin-top:4px}
  .sub{margin-top:14px;font-size:14px;color:var(--grey)}
  .sub.dim{color:var(--grey2);margin-top:4px}

  /* ---------- 总进度 ---------- */
  .ring-box{
    display:flex;align-items:center;gap:20px;
    margin:28px 0 26px;padding:20px 22px;
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    position:relative;overflow:hidden;
  }
  .ring-box::after{
    content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;
    background:radial-gradient(circle,rgba(57,225,196,.10),transparent 70%);
  }
  .ring{position:relative;width:82px;height:82px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .num{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;
  }
  .ring .num small{font-size:11px;font-weight:600;color:var(--grey);margin-left:1px}
  .ring-meta{flex:1;min-width:0}
  .ring-meta .t{font-size:15px;font-weight:700;margin-bottom:6px}
  .ring-meta .d{font-size:13px;color:var(--grey);line-height:1.6}
  .ring-meta .d b{color:var(--accent);font-weight:700}

  /* ---------- 主线卡 ---------- */
  .overview{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:34px}
  @media(max-width:420px){.overview{grid-template-columns:1fr}}
  .ov{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px;position:relative;overflow:hidden;
  }
  .ov .tag{font-size:11px;letter-spacing:.1em;color:var(--grey2);margin-bottom:8px}
  .ov .name{font-size:17px;font-weight:700;margin-bottom:14px}
  .ov .row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .ov .cnt{font-size:13px;color:var(--grey)}
  .ov .pct{font-size:20px;font-weight:800;color:var(--grey2);font-variant-numeric:tabular-nums}
  .ov .pct.done{color:var(--ok)}

  /* ---------- 阶段 ---------- */
  .stage{margin-bottom:8px}
  .stage-head{display:flex;align-items:flex-start;gap:12px;margin:34px 0 16px}
  .badge{
    flex:0 0 auto;width:44px;height:34px;border-radius:10px;
    background:rgba(57,225,196,.08);border:1px solid rgba(57,225,196,.4);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:800;color:var(--accent);
  }
  .stage-head .txt{flex:1;min-width:0}
  .stage-head h2{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .stage-head .note{font-size:12.5px;color:var(--grey2);margin-top:3px}
  .stage-head .count{font-size:13px;color:var(--grey);flex:0 0 auto;padding-top:5px;font-variant-numeric:tabular-nums}

  /* ---------- 任务卡 ---------- */
  .task{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;margin-bottom:10px;position:relative;
    opacity:0;transform:translateY(18px);
    transition:opacity .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1),border-color .3s,background .3s;
  }
  .task.in{opacity:1;transform:none}
  .task.todo:hover{background:var(--card-hi);border-color:#2e3c4a}
  .task.done{border-color:rgba(47,227,165,.32)}
  .task.next{
    background:linear-gradient(180deg,rgba(57,225,196,.07),rgba(21,28,36,0));
    border-color:rgba(57,225,196,.55);
    box-shadow:0 0 0 1px rgba(57,225,196,.08),0 10px 30px -18px rgba(57,225,196,.6);
  }
  .task.blocked{border-color:rgba(255,107,107,.4)}
  .task-top{display:flex;align-items:flex-start;gap:10px}
  .tid{
    font-size:12px;font-weight:700;color:var(--accent2);flex:0 0 auto;
    padding-top:3px;font-variant-numeric:tabular-nums;letter-spacing:.02em;
  }
  .task.next .tid{color:var(--accent)}
  .tt{flex:1;min-width:0}
  .tt h3{font-size:15.5px;font-weight:700;line-height:1.4}
  .tt p{font-size:12.5px;color:var(--grey);margin-top:4px;line-height:1.55}
  .tp{
    flex:0 0 auto;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;
    color:var(--grey2);padding-top:2px;min-width:44px;text-align:right;
  }
  .task.done .tp{color:var(--ok)}
  .task.next .tp{color:var(--accent)}
  .task.blocked .tp{color:var(--block)}
  .bar{
    height:4px;background:var(--track);border-radius:3px;
    margin-top:13px;overflow:hidden;
  }
  .bar i{
    display:block;height:100%;width:0;border-radius:3px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    transition:width 1.1s cubic-bezier(.22,1,.36,1) .15s;
  }
  .task.done .bar i{background:linear-gradient(90deg,#1fae86,var(--ok))}
  .task.blocked .bar i{background:var(--block)}
  .st{
    display:inline-flex;align-items:center;gap:5px;
    font-size:10.5px;font-weight:700;letter-spacing:.06em;
    padding:2px 7px;border-radius:5px;margin-top:9px;
    background:rgba(255,255,255,.05);color:var(--grey2);
  }
  .st::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .task.next .st{background:rgba(57,225,196,.12);color:var(--accent)}
  .task.done .st{background:rgba(47,227,165,.12);color:var(--ok)}
  .task.blocked .st{background:rgba(255,107,107,.12);color:var(--block)}
  .st.working{background:rgba(255,176,32,.12);color:var(--warn)}
  .note-line{
    font-size:11.5px;color:var(--warn);margin-top:8px;
    padding-left:9px;border-left:2px solid rgba(255,176,32,.5);line-height:1.5;
  }

  /* ---------- 底部 ---------- */
  footer{margin-top:44px;padding-top:24px;border-top:1px solid var(--line)}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:22px}
  .lg{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--grey)}
  .lg i{width:9px;height:9px;border-radius:3px;display:block}
  .notes{font-size:12px;color:var(--grey2);line-height:2}
  .sign{
    margin-top:22px;font-size:12px;color:var(--accent);
    letter-spacing:.04em;padding-bottom:20px;
  }
  .sign span{color:var(--grey2)}

  /* 静态模式：?static —— 跳过全部进场动画，直接呈现终态（截图 / 打印 / 老浏览器用） */
  body.static-mode .task{opacity:1!important;transform:none!important;transition:none!important}
  body.static-mode .bar i{transition:none!important}
  body.static-mode .ring svg circle{transition:none!important}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="wrap">
  <header>
    <div class="eyebrow">Project Tracker</div>
    <h1>zuoer64<span class="accent">双壳计划</span></h1>
    <p class="sub">亚克力堆叠 × 3D 打印船壳　·　原设计 别离</p>
    <p class="sub dim">两条线共用一套尺寸：亚克力先定结构，打印线重新设计榫卯</p>
  </header>

  <div class="ring-box in">
    <div class="ring">
      <svg width="82" height="82">
        <circle cx="41" cy="41" r="34" fill="none" stroke="var(--track)" stroke-width="7"/>
        <circle id="ringArc" cx="41" cy="41" r="34" fill="none" stroke="var(--accent)"
                stroke-width="7" stroke-linecap="round"
                stroke-dasharray="213.6" stroke-dashoffset="213.6"
                style="transition:stroke-dashoffset 1.6s cubic-bezier(.22,1,.36,1) .2s"/>
      </svg>
      <div class="num"><span id="ringNum">0</span><small>%</small></div>
    </div>
    <div class="ring-meta">
      <div class="t">总进度</div>
      <div class="d"><span id="doneCnt">0</span> / <span id="allCnt">15</span> 项完成　·　下一步 <b id="nextName">—</b></div>
      <div class="d" style="font-size:12px;color:var(--grey2);margin-top:4px">
        更新于 <span id="upd">—</span>
      </div>
    </div>
  </div>

  <div class="overview">
    <div class="ov">
      <div class="tag">主线 01</div>
      <div class="name">亚克力堆叠</div>
      <div class="row"><span class="cnt">2.77mm 板材 · 半榫卯</span><span class="pct" data-ov="01">0%</span></div>
      <div class="bar"><i data-ovbar="01"></i></div>
    </div>
    <div class="ov">
      <div class="tag">主线 02</div>
      <div class="name">3D 打印船壳</div>
      <div class="row"><span class="cnt">无定位板 · 模块化</span><span class="pct" data-ov="02">0%</span></div>
      <div class="bar"><i data-ovbar="02"></i></div>
    </div>
  </div>

  <div id="stages"></div>

  <footer>
    <div class="legend">
      <div class="lg"><i style="background:var(--grey2)"></i>待启动</div>
      <div class="lg"><i style="background:var(--warn)"></i>进行中</div>
      <div class="lg"><i style="background:var(--ok)"></i>已完成</div>
      <div class="lg"><i style="background:var(--accent)"></i>下一步</div>
      <div class="lg"><i style="background:var(--block)"></i>卡住</div>
    </div>
    <div class="notes">
      · 不给时间表，只给进度和卡点；卡住会写明卡在哪一步<br>
      · 图纸、爆炸图、模型文件产出后放群文件<br>
      · 改进度：编辑同目录 <b>data.js</b>，保存后刷新本页
    </div>
    <div class="sign">zuoer64 BUILD LOG <span>·</span> 蒸栗子</div>
  </footer>
</div>

<script src="data.js"></script>
<script>
/* ============ 任务定义（改这里要动 index.html，一般不用改） ============ */
const STAGES = [
  { num:"01", name:"亚克力堆叠线", note:"2.77mm 板材 · 半榫卯 · gas + PC 定位板", key:"01", tasks:[
    { id:"1.1", t:"建 zuoer 知识库", d:"结构 / 半榫卯 / 板厚 / 五金 / 公差全部入库，让 agent 学会 zuoer" },
    { id:"1.2", t:"选模型 + 装建模软件", d:"能读懂三维的模型，加参数化建模后端" },
    { id:"1.3", t:"接建模 MCP + 配 harness", d:"让模型能真的改几何，不是只会描述" },
    { id:"1.4", t:"导入原始 CAD，盘 bug 清单", d:"哪一层哪一处、干涉多少 mm、涉及哪版图纸" },
    { id:"1.5", t:"修 bug 出定版 + 版本号", d:"配变更记录，让群友知道哪版是新的" },
    { id:"1.6", t:"出三套图：编号 / 分层 / 分步", d:"群友不看视频、只拿这套图能拼出来" },
    { id:"1.7", t:"生成亚克力堆叠 3D 模型", d:"可校核、可导出爆炸视图" },
    { id:"1.8", t:"五金减种类", d:"专用压铆 → 通用件，7~8 种压到 4 种内，在 3D 里验孔位" },
    { id:"1.9", t:"切实物验证（17pad 约 40 元）", d:"确认 2.77mm 公差下真的能装" }
  ]},
  { num:"02", name:"3D 打印船壳线", note:"无 gas · 无定位板 · 打印机 270×270 以内", key:"02", tasks:[
    { id:"2.1", t:"定无定位板方案", d:"抛弃 gas，写清 PCB 怎么固定、键帽高度怎么定" },
    { id:"2.2", t:"打印公差基线试片", d:"0.1 / 0.2 / 0.3 / 0.4mm 四组间隙，测你的机器实际值" },
    { id:"2.3", t:"榫卯重构", d:"亚克力只能平面层叠，3D 各面自由，重新设计不照搬" },
    { id:"2.4", t:"拆分 + 连接件重铸", d:"按 270×270 分包，四方柱 / 四面框模块化" },
    { id:"2.5", t:"配色与艺术性修改", d:"定色卡与外形细节，出效果图" },
    { id:"2.6", t:"打样", d:"先白模验证结构，再终版上色" }
  ]}
];

/* ============ 从 data.js 合并进度 ============ */
const DATA = (window.PROGRESS && Array.isArray(window.PROGRESS.tasks)) ? window.PROGRESS.tasks : [];
const MAP = {};
DATA.forEach(x => { MAP[x.id] = x; });

STAGES.forEach(s => s.tasks.forEach(t => {
  const o = MAP[t.id] || {};
  t.pct = typeof o.pct === "number" ? Math.max(0, Math.min(100, o.pct)) : 0;
  t.status = o.status || (t.pct >= 100 ? "done" : "todo");
  t.note = o.note || "";
}));

/* ============ 渲染 ============ */
const STATUS_TEXT = { todo:"待启动", doing:"进行中", done:"已完成", next:"下一步", blocked:"卡住" };
const allTasks = STAGES.flatMap(s => s.tasks);
const totalDone = allTasks.filter(t => t.pct >= 100).length;
const nextTask = allTasks.find(t => t.status === "next") || null;

document.getElementById("allCnt").textContent = allTasks.length;
document.getElementById("doneCnt").textContent = totalDone;
document.getElementById("nextName").textContent = nextTask ? (nextTask.id + " " + nextTask.t) : "待定";
document.getElementById("upd").textContent = (window.PROGRESS && window.PROGRESS.updated) || "未标注";

const host = document.getElementById("stages");
STAGES.forEach(stage => {
  const done = stage.tasks.filter(t => t.pct >= 100).length;
  const sec = document.createElement("section");
  sec.className = "stage";
  sec.innerHTML = `
    <div class="stage-head">
      <div class="badge">${stage.num}</div>
      <div class="txt">
        <h2>${stage.name}</h2>
        <div class="note">${stage.note}</div>
      </div>
      <div class="count">${done} / ${stage.tasks.length}</div>
    </div>`;

  stage.tasks.forEach(t => {
    const el = document.createElement("article");
    el.className = "task " + t.status;
    el.innerHTML = `
      <div class="task-top">
        <div class="tid">${t.id}</div>
        <div class="tt">
          <h3>${t.t}</h3>
          <p>${t.d}</p>
        </div>
        <div class="tp" data-pct="${t.pct}">${t.pct}%</div>
      </div>
      <div class="bar"><i data-fill="${t.pct}"></i></div>
      <div class="st ${t.status === "doing" ? "working" : ""}">${STATUS_TEXT[t.status] || "待启动"}</div>
      ${t.note ? `<div class="note-line">${t.note}</div>` : ""}`;
    sec.appendChild(el);
  });
  host.appendChild(sec);
});

/* ============ 静态模式开关 ============ */
const STATIC = location.search.indexOf("static") > -1;
if (STATIC) document.body.classList.add("static-mode");

/* ============ 总进度环 + 概览百分比 ============ */
const overallPct = Math.round(totalDone / allTasks.length * 100);
const arc = document.getElementById("ringArc");
const circumference = 2 * Math.PI * 34;
arc.setAttribute("stroke-dasharray", circumference.toFixed(1));

function countTo(el, target, dur = 1400, suffix = "") {
  if (STATIC) { el.textContent = target + suffix; return; }
  const start = performance.now();
  const from = 0;
  function step(now) {
    const p = Math.min((now - start) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (target - from) * eased) + suffix;
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function setRing() {
  arc.style.strokeDashoffset = (circumference * (1 - overallPct / 100)).toFixed(1);
  countTo(document.getElementById("ringNum"), overallPct);
}
if (STATIC) setRing(); else setTimeout(setRing, 260);

STAGES.forEach(s => {
  const pct = Math.round(s.tasks.filter(t => t.pct >= 100).length / s.tasks.length * 100);
  const lbl = document.querySelector(`[data-ov="${s.key}"]`);
  const bar = document.querySelector(`[data-ovbar="${s.key}"]`);
  if (lbl) {
    if (pct >= 100) lbl.classList.add("done");
    setTimeout(() => countTo(lbl, pct, 900, "%"), STATIC ? 0 : 300);
  }
  if (bar) setTimeout(() => { bar.style.width = pct + "%"; }, STATIC ? 0 : 400);
});

/* ============ 滚动进场 ============ */
const io = new IntersectionObserver((entries) => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    const el = en.target;
    el.classList.add("in");
    const fill = el.querySelector("[data-fill]");
    if (fill) setTimeout(() => { fill.style.width = fill.dataset.fill + "%"; }, 120);
    io.unobserve(el);
  });
}, { threshold: 0.15, rootMargin: "0px 0px -40px 0px" });

document.querySelectorAll(".task").forEach((el, i) => {
  const fill = el.querySelector("[data-fill]");
  if (STATIC) {
    el.classList.add("in");
    if (fill) fill.style.width = fill.dataset.fill + "%";
    return;
  }
  el.style.transitionDelay = (i % 4) * 40 + "ms";
  io.observe(el);
});

/* ============ Canvas 粒子网格背景 ============ */
(() => {
  const cv = document.getElementById("bg");
  const ctx = cv.getContext("2d");
  let w, h, dpr, pts = [];
  const isMobile = matchMedia("(max-width: 640px)").matches;
  const COUNT = isMobile ? 34 : 58;
  const LINK = isMobile ? 110 : 140;
  const mouse = { x: -9999, y: -9999 };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pts = Array.from({ length: COUNT }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - .5) * .28, vy: (Math.random() - .5) * .28,
      r: Math.random() * 1.4 + .6
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;

      const dm = Math.hypot(p.x - mouse.x, p.y - mouse.y);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = dm < 150 ? "rgba(57,225,196,.55)" : "rgba(124,200,255,.28)";
      ctx.fill();

      for (let j = i + 1; j < pts.length; j++) {
        const q = pts[j];
        const dx = p.x - q.x, dy = p.y - q.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < LINK * LINK) {
          const a = (1 - Math.sqrt(d2) / LINK) * .16;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = `rgba(90,150,190,${a})`;
          ctx.lineWidth = .7;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener("resize", resize);
  window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener("mouseleave", () => { mouse.x = mouse.y = -9999; });
  resize();
  draw();
})();
</script>
</body>
</html>
